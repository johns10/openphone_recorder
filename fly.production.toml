# fly.toml app configuration file generated for discussit-production on 2023-08-27T18:49:23-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "discussit-production"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "5s"
swap_size_mb = 512

[experimental]
  auto_rollback = true

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_HOST = "app.discussit.ai"
  PORT = "8080"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "1s"
